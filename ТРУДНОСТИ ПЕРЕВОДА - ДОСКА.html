<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Трудности перевода — доска сценариста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cork-a:#c99a5f;
    --cork-b:#b98548;
    --wood:#5b3a24;
    --wood-dark:#432a1a;
    --paper:#faf6ec;
    --ink:#2b241a;
    --ink-soft:#6b5f4d;
    --pin-shadow: rgba(0,0,0,.35);

    --c-dash-bg:#f7e79a;   --c-dash-tape:#d8bd3f;
    --c-star-bg:#f5c9d8;   --c-star-tape:#dd85a8;
    --c-eq-bg:#bcdcf7;     --c-eq-tape:#5f9fd6;
    --c-pct-bg:#c8ecc0;    --c-pct-tape:#79bf63;
    --c-hash-bg:#f8d8a4;   --c-hash-tape:#e3963f;
    --c-caret-bg:#ddc9f5;  --c-caret-tape:#a370dd;
    --c-sub-bg:#2b241a;    --c-sub-tape:#c99a5f;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 20%, rgba(0,0,0,.05) 0, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(0,0,0,.06) 0, transparent 45%),
      repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.035) 0px, rgba(0,0,0,.035) 1px, transparent 1px, transparent 5px),
      linear-gradient(160deg, var(--cork-a), var(--cork-b));
    min-height:100vh;
  }

  /* ---------- Frame / header ---------- */
  .frame{
    border:14px solid var(--wood);
    border-image: linear-gradient(160deg, #6b4527, #40280f) 1;
    box-shadow: inset 0 0 40px rgba(0,0,0,.45), 0 0 0 4px var(--wood-dark) inset;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:22px 28px 14px;
    display:flex;
    align-items:flex-start;
    gap:22px;
    flex-wrap:wrap;
  }

  .title-card{
    background:var(--paper);
    padding:10px 20px;
    transform:rotate(-1.2deg);
    box-shadow:3px 4px 10px rgba(0,0,0,.35);
    position:relative;
  }
  .title-card::before{
    content:"";
    position:absolute; top:-9px; left:50%; transform:translateX(-50%) rotate(-4deg);
    width:46px; height:18px;
    background:rgba(220,80,60,.55);
    box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .title-card h1{
    font-family:'Kalam',cursive;
    font-size:26px;
    margin:2px 0 0;
    line-height:1.05;
  }
  .title-card .sub{
    font-family:'Courier Prime', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .timecode-pin{
    background:#fff9dd;
    padding:10px 16px;
    font-family:'Courier Prime', monospace;
    font-size:13px;
    transform:rotate(2deg);
    box-shadow:3px 4px 8px rgba(0,0,0,.3);
    position:relative;
    align-self:center;
  }
  .timecode-pin::after{
    content:"📌";
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    font-size:18px;
  }

  .legend{
    margin-left:auto;
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    align-items:center;
    background:rgba(255,255,255,.14);
    padding:8px 12px;
    border-radius:6px;
    max-width:520px;
  }
  .legend .lg-title{
    font-family:'Kalam',cursive;
    font-size:13px;
    color:#fff;
    width:100%;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .chip{
    display:flex; align-items:center; gap:5px;
    font-size:11.5px;
    color:var(--ink);
    background:var(--paper);
    padding:2px 8px 2px 4px;
    border-radius:3px;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .chip .swatch{
    width:14px;height:14px;border-radius:2px;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:700; font-size:10px; color:rgba(0,0,0,.55);
  }

  /* ---------- Body layout ---------- */
  .body-wrap{
    flex:1;
    display:flex;
    min-height:0;
    padding:0 20px 20px;
    gap:18px;
  }

  /* Sidebar */
  .sidebar{
    width:330px;
    flex-shrink:0;
    background:rgba(67,42,26,.55);
    border-radius:8px;
    padding:14px;
    display:flex;
    flex-direction:column;
    box-shadow: inset 0 0 20px rgba(0,0,0,.3);
  }
  .search-box{
    display:flex;
    margin-bottom:10px;
  }
  .search-box input{
    width:100%;
    padding:9px 10px;
    border:none;
    border-radius:5px 0 0 5px;
    font-family:'Inter';
    font-size:13.5px;
    background:var(--paper);
    color:var(--ink);
  }
  .search-box button{
    border:none;
    background:#3c2716;
    color:#f3e5c8;
    padding:0 12px;
    border-radius:0 5px 5px 0;
    cursor:pointer;
    font-size:14px;
  }
  .search-box button:hover{background:#523320;}

  .section-count{
    color:#f3e6cf;
    font-family:'Courier Prime',monospace;
    font-size:11px;
    margin-bottom:8px;
    opacity:.8;
  }

  .section-list{
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:6px;
    padding-right:4px;
  }
  .section-list::-webkit-scrollbar{width:8px;}
  .section-list::-webkit-scrollbar-thumb{background:#2f1d10;border-radius:4px;}
  .section-list::-webkit-scrollbar-track{background:transparent;}

  .sec-btn{
    text-align:left;
    background:rgba(250,246,236,.08);
    border:1px solid rgba(250,246,236,.14);
    color:#f6ecd8;
    padding:5px 9px;
    border-radius:14px;
    font-size:12px;
    cursor:pointer;
    display:inline-flex;
    justify-content:center;
    gap:5px;
    align-items:center;
    transition:background .12s, transform .12s;
    white-space:nowrap;
  }
  .sec-btn:hover{background:rgba(250,246,236,.2); transform:translateY(-1px);}
  .sec-btn span:first-child{
    max-width:200px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sec-btn.active{
    background:var(--paper);
    color:var(--ink);
    font-weight:700;
    border-color:transparent;
  }
  .sec-btn .badge{
    font-family:'Courier Prime',monospace;
    font-size:9.5px;
    opacity:.7;
    flex-shrink:0;
  }
  .sec-btn.group-label{
    background:transparent;
    border:none;
    cursor:default;
    color:#d8b877;
    font-family:'Kalam',cursive;
    font-size:14px;
    padding:10px 4px 2px;
    text-transform:uppercase;
    letter-spacing:.5px;
    width:100%;
    flex-basis:100%;
    display:block;
  }
  .sec-btn.group-label:hover{background:transparent; transform:none;}

  /* Board */
  .board-pane{
    flex:1;
    overflow-y:auto;
    padding:6px 6px 30px 2px;
  }
  .board-pane::-webkit-scrollbar{width:10px;}
  .board-pane::-webkit-scrollbar-thumb{background:rgba(0,0,0,.3);border-radius:5px;}
  .board-pane::-webkit-scrollbar-track{background:transparent;}

  .board-heading{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin:4px 4px 16px;
  }
  .board-heading h2{
    font-family:'Kalam',cursive;
    color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,.4);
    font-size:26px;
    margin:0;
  }
  .board-heading .cnt{
    font-family:'Courier Prime',monospace;
    color:#fff2d8;
    font-size:12.5px;
    opacity:.85;
  }

  .board-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:20px 16px;
    align-items:start;
  }

  .note{
    position:relative;
    background:var(--paper);
    padding:16px 14px 14px;
    font-size:13.3px;
    line-height:1.42;
    box-shadow:2px 5px 10px rgba(0,0,0,.35);
    color:var(--ink);
  }
  .note::before{ /* washi tape */
    content:"";
    position:absolute;
    top:-10px; left:50%;
    width:52px; height:20px;
    transform:translateX(-50%) rotate(-3deg);
    opacity:.9;
  }
  .note p{margin:0;}
  .note .mk{
    display:inline-block;
    font-family:'Courier Prime',monospace;
    font-weight:700;
    font-size:11px;
    padding:1px 6px;
    border-radius:3px;
    margin-bottom:6px;
    color:rgba(0,0,0,.6);
  }
  .note mark{
    background:none;
    color:inherit;
    font-weight:700;
    text-decoration:underline;
    text-decoration-color:rgba(200,40,40,.6);
    text-decoration-thickness:2px;
  }

  .note.type-dash{ background:var(--c-dash-bg); }
  .note.type-dash::before{ background:var(--c-dash-tape); }
  .note.type-star{ background:var(--c-star-bg); }
  .note.type-star::before{ background:var(--c-star-tape); }
  .note.type-eq{ background:var(--c-eq-bg); }
  .note.type-eq::before{ background:var(--c-eq-tape); }
  .note.type-pct{ background:var(--c-pct-bg); }
  .note.type-pct::before{ background:var(--c-pct-tape); }
  .note.type-hash{ background:var(--c-hash-bg); }
  .note.type-hash::before{ background:var(--c-hash-tape); }
  .note.type-caret{ background:var(--c-caret-bg); }
  .note.type-caret::before{ background:var(--c-caret-tape); }

  .note:nth-child(4n+1){ transform:rotate(-1.1deg); }
  .note:nth-child(4n+2){ transform:rotate(0.8deg); }
  .note:nth-child(4n+3){ transform:rotate(-0.4deg); }
  .note:nth-child(4n+4){ transform:rotate(1.3deg); }
  .note:hover{ transform:scale(1.035) rotate(0deg) !important; box-shadow:4px 10px 18px rgba(0,0,0,.45); z-index:5; transition:.15s; }

  .note.subhead{
    grid-column:1 / -1;
    background:var(--c-sub-bg);
    color:#f5e9c9;
    transform:rotate(0deg) !important;
    padding:10px 18px;
    font-family:'Kalam',cursive;
    font-size:16px;
    box-shadow:2px 4px 10px rgba(0,0,0,.4);
  }
  .note.subhead::before{ background:var(--c-sub-tape); width:64px; }
  .note.subhead .mk{display:none;}

  .note .from-sec{
    display:block;
    font-family:'Courier Prime',monospace;
    font-size:10px;
    color:var(--ink-soft);
    margin-top:8px;
    opacity:.75;
  }

  .empty-msg{
    color:#fff;
    font-family:'Kalam',cursive;
    font-size:18px;
    text-align:center;
    margin-top:60px;
    opacity:.85;
  }

  @media (max-width: 820px){
    .body-wrap{flex-direction:column;}
    .sidebar{width:100%; max-height:220px;}
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="title-card">
      <h1>Трудности перевода Dead by Daylight</h1>
      <div class="sub">доска сценариста · заметки по ошибкам локализации</div>
    </div>
    <div class="timecode-pin" id="timecodePin"></div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="body-wrap">
    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по всем заметкам…">
        <button id="searchBtn">🔎</button>
      </div>
      <div class="section-count" id="sectionCount"></div>
      <div class="section-list" id="sectionList"></div>
    </aside>

    <main class="board-pane">
      <div class="board-heading">
        <h2 id="boardTitle">—</h2>
        <span class="cnt" id="boardCount"></span>
      </div>
      <div class="board-grid" id="boardGrid"></div>
    </main>
  </div>
</div>

и"}, {"marker": "=", "text": "Call Of Brine - Солёное Море, но опущено call - зов"}]}, {"title": "ДРЕДЖ", "items": [{"marker": "-", "text": "Паства была сформирована на острове, а не просто осела. А создали её филантропы, а не просто купили остров"}, {"marker": "-", "text": "Опущено dismayed, disenchanted, and disillusioned и заменено не неподходящее кто разочаровался и не знал, что делать дальше. Также нет в оригинале фразы свободно жить, они там нифига не были свободными, только свободными от тёмных мыслей и эмоций."}, {"marker": "-", "text": "Отто изгонял БЫСТРО, а не БЕЗЖАЛОСТНО, так как мы ещё не знаем, что он убивал всех тех, кто решил покинуть остров"}, {"marker": "-", "text": "In this way ≠ Постепенно, так как тёмные мысли - основной принцип Оттомарства"}, {"marker": "-", "text": "Опущено, что челюсти страха так и не отпустили остров"}, {"marker": "-", "text": "Had summoned (последователи призвали Дреджа) ≠ Смог вторгнуться"}, {"marker": "-", "text": "Guardiand of The Fold были переведены, как Пастыри. Ок, но ПОЧЕМУ ПОСЛЕ ИХ НАЗЫВАЮТ ОХРАННИКАМИ"}, {"marker": "-", "text": "Lies ≠ Речь"}, {"marker": "-", "text": "Reached into the murky recesses of their hearts and dredged up dark and fearful things ≠ пробудив темные и кошмарные мысли. Полностью заменена сложная метафора с «мутными глубинами сердец» и «вытаскиванием тёмного и страшного» на простое «запали в души, пробудив мысли»."}, {"marker": "-", "text": "Отто - пастырь, однако Пастырями нарекли Guardians Of The Fold, поэтому нужно было или нормально переводить изначально, или переводить звание Отто как-то по другому"}, {"marker": "-", "text": "Опущено сравнение Дреджа с конём на дыбах"}, {"marker": "-", "text": "«Had imagined» (вообразил) → «верил»; «made them all imagine» (заставил их вообразить) → «заставил поверить других»."}, {"marker": "*", "text": "Кофеиновые Таблетки: They would bring (Они призовут) ≠ Стращая их. Уменьшается чувство вины, которое пытался привить Отто Стэмпер"}, {"marker": "*", "text": "Пахотный Инструмент: Добавлено, что на острове был СКУДНЫЙ урожай"}, {"marker": "*", "text": "Диктофон: Foray (вылазка) ≠ Дела"}, {"marker": "*", "text": "Жертвенный Нож: Сомневающиеся != Dissenters. В оригинале это послание было инакомыслящим или несогласным, то есть предателям, которых необходимо было найти"}]}, {"title": "ВЕСКЕР", "items": [{"marker": "-", "text": "«Достиг больших карьерных успехов» ≠ «Made great strides with Umbrella»: Оригинал — добился больших успехов вместе с Umbrella, русский — «карьерные успехи», что звучит как личное продвижение. Русский отделяет Вескера от компании, тогда как оригинал — он был частью её успеха."}, {"marker": "-", "text": "Работодатель != Corporation. Уместнее было бы использовать корпорация"}, {"marker": "-", "text": "«Подвергся влиянию» ≠ «exposed himself»: Оригинал — сам подверг себя воздействию (активное действие), русский — пассивное «подвергся влиянию»."}, {"marker": "-", "text": "Склад != Hangar. Hangar = ангар (авиационное/военное помещение), склад = warehouse, потом всё-таки переведут hangar как ангар."}, {"marker": "*", "text": "RPD Walkie: Опущено то, что эта рация крепится на плечо, а также, что является собственностью RPD"}, {"marker": "*", "text": "Отвалившаяся Ручка: Насадка для ручки» ≠ «Crank-shaped hole»: Оригинал — «отверстие под рукоятку», русский — «насадка» (что-то надеваемое на ручку)."}]}, {"title": "РЫЦАРЬ", "items": [{"marker": "-", "text": "В оригинале Тархос сам ПРЕСЛЕДУЕТ/гонится за этими воспоминаниями (\"he would chase\"), это активное действие с его стороны — он одержим погоней за пережитым чувством. В переводе воспоминания САМИ преследуют его (\"преследовали его\") — он становится пассивной жертвой. Это меняет характер мотивации персонажа"}, {"marker": "-", "text": "\"wooden cracks\" (щели в дереве) заменено на \"решетку\""}, {"marker": "-", "text": "\"Eyes wide open\" с явным указанием на ОСМЫСЛЕННОЕ желание понять (\"a heart wanting to understand\") — а в переводе добавлено слово \"бездумно\" (mindlessly), которое противоречит смыслу оригинала: он не \"бездумно\" смотрел, а наоборот — пытался ПОНЯТЬ сердцем. Слово \"бездумно\" — это добавленная и противоречащая смыслу деталь"}, {"marker": "-", "text": "\"Durkos\" → \"Даркос\". Транслитерация неточна — \"Durkos\" ближе к \"Дуркос\", а не \"Даркос\". Несогласованность с оригинальным звучанием имени."}, {"marker": "-", "text": "\"Приевшихся\" (надоевших/набивших оскомину) — оценочное слово, которого нет в оригинале (\"all that killing\" — просто все эти убийства, без подразумевания, что они ему надоели/приелись). Добавлен несуществующий оттенок."}, {"marker": "-", "text": "Грамматическая ошибка - охранили"}, {"marker": "-", "text": "Blood and Gore ≠ Кровавый"}, {"marker": "-", "text": "Тархос и его армия распидорасили Отряд Гуардия. В переводе же набранная Тархосом армия"}, {"marker": "-", "text": "\"Without judgment\" (без осуждения/не подвергая её оценке) полностью пропущено — это важная характеристика отношения Тархоса к своей тьме (он принял её, не считая её плохой), и в переводе эта деталь утрачена, заменена на \"всем сердцем\" — другой смысловой акцент (эмоциональная полнота принятия, а не отсутствие морального суждения)"}, {"marker": "-", "text": "Charged through pools of blood (Промчался по лужам крови) ≠ втаптывать их в лужи"}, {"marker": "-", "text": "The Sublime\" — это философский термин «возвышенное» (категория эстетики, связанная именно с сочетанием красоты и ужаса/благоговейного трепета, что прямо перекликается с предыдущей строкой \"the beauty and the horror\" и со словом \"Awe\" в начале истории)"}, {"marker": "*", "text": "\"Gritty Lump\" → \"Черствая краюха\". Неточность. \"Gritty\" — зернистый/грубый по текстуре (от наличия песка/крупы в тесте), а не \"черствый\" (stale — старый, сухой). Разные характеристики хлеба."}, {"marker": "*", "text": "\"Battleaxe Head\" → \"Лезвие боевого топора\". Небольшая неточность: \"head\" топора — это весь металлический набалдашник (включающий обух и лезвие), а не только \"лезвие\" (blade)."}, {"marker": "*", "text": "\"Showed no remorse\" (не испытывал раскаяния/совести за свои действия) переведено как \"не привык сожалеть о былом\" (не сожалел о ПРОШЛОМ/прошедшем) — это про ностальгию/тоску по минувшему, а не про отсутствие раскаяния. Совершенно другое значение."}, {"marker": "=", "text": "Лик != Face the. Это буквально философия Рыцаря, принять тьму"}]}, {"title": "ТОРГОВКА", "items": [{"marker": "-", "text": "Schoolyard games (игры на школьном дворе, типа догонялок, пряток) != Спортивные игры"}, {"marker": "-", "text": "By middle school (к моменту средней школы) != К концу начальной школы"}, {"marker": "-", "text": "Publishing company went into administration (Издательская компания перешла под внешнее управление/банкротство) != Руководство пересмотрело стратегию"}, {"marker": "-", "text": "Visions (видения, возможно проявление Сущности) != Фантазии"}, {"marker": "-", "text": "На протяжении всей истории присутствует слово Gut - Потрошить. Сначала в контексте персонажа из Тёмной Манги. Затем в контексте Адрианы, скупающей и компании, она их потрошила с максимальным профитом."}, {"marker": "-", "text": "High School != Средняя Школа. По традициям так принято переводить, однако в истории Юи Кимуры есть старшая школа, или Япония и Бразилия различаются?"}, {"marker": "-", "text": "Торговка Черепами не зря одета по последнему писку моды во время убийств, так как feeling something within demanding expression (чувством, которое требует самовыражения) != подталкивает её изнутри"}, {"marker": "-", "text": "У выражения larger-than-life очень много значений - невероятно яркий, колоритный, незаурядный, харизматичный, масштабный, человек-легенда, однако оставили только харизматичный."}, {"marker": "-", "text": "Last != Следующей целью. Это говорится о том, что эта жертва будет последней перед попаданием в измерение Сущности"}, {"marker": "-", "text": "Опущено airship у описания ангара"}, {"marker": "-", "text": "\"hardened\" (ожесточилось) переведено как \"застыло\" (froze) — немного иной оттенок эмоции."}, {"marker": "-", "text": "\"a dying heart\" (умирающее, ещё бьющееся сердце — процесс) переведено как \"переставшего биться сердца\" (сердце, которое уже остановилось — завершённое состояние) — временной сдвиг от процесса к результату."}, {"marker": "-", "text": "\"a new chapter\" (новую главу — литературная метафора, тематически связанная с мангой) переведено просто как \"новой жизни\" — потеряна метафора \"главы\"."}, {"marker": "*", "text": "Мощный прожектор: \"discombobulates\" (сбивает с толку/дезориентирует — довольно разговорное, лёгкое по тону слово) переведено усиленно как \"выводит из строя\" (incapacitates) — более серьёзное по интенсивности воздействие, чем шутливо-лёгкий оригинал."}, {"marker": "*", "text": "Supercharge (Сверхзаряд) != Сверхнапряжение. В описании safety protocols != без предохранителей. Также опущено from the cells"}, {"marker": "*", "text": "Shotgun Speakers (узконаправленные динамики или динамик-дробовик) != Оглушающие динамики"}, {"marker": "*", "text": "Анализатор Уязвимостей: везде Drone переведён как Коптер, а в истории Адрианы и в этом аддоне, как Дрон"}, {"marker": "*", "text": "Генератор Красного Шума: очень ленивый перевод blanketing the soundscape and making it difficult to hear anything else - перекрывая прочие звуки"}, {"marker": "*", "text": "Импульсы != Randomized Strobes - Мигающий свет. Стробоскобы в оригинале \"find purchase\" (найти опору/зацепиться ногами — физическая устойчивость при ходьбе) переведено как \"ориентирование\" (orientation) — смена конкретного физического аспекта (устойчивость на ногах) на более общий когнитивный (ориентация в пространстве)."}, {"marker": "*", "text": "Расширенный прогноз перемещений: грамматическая ошибка - аура становЯтся"}, {"marker": "*", "text": "Expired Batteries (Просроченные аккумуляторы) != Разряженные аккумуляторы"}, {"marker": "=", "text": "Догонялки: pick apart (разбирать по кусочкам) != потрошить. Зато нашлось это здесь"}, {"marker": "=", "text": "БАЦ!: услышать громкий != mighty. В оригинале боялись её могучего БАЦ, а не услышать громкий"}, {"marker": "=", "text": "Рычаг Влияния: ленивый перевод Kick your competitors when they're down. Never let them regain lost ground != Не дай врагам своим подняться с колен."}]}, {"title": "СИНГУЛЯРНОСТЬ", "items": [{"marker": "-", "text": "Опущено ООО у компании Хаксли Индастриз"}, {"marker": "-", "text": "\"initial power source\" (изначальный/первичный источник питания — предполагается, что это стартовый/резервный источник, а не основной постоянный) переведено как \"Основным источником питания\" (main/primary power source) — смысловой сдвиг с \"начального\" на \"основной\", что меняет иерархию систем питания андроида."}, {"marker": "-", "text": "\"life-like silicon skin\" (жизнеподобная силиконовая кожа — конкретная характеристика материала и его правдоподобия) переведено просто как \"кожа изделия\" — потеряны оба уточнения: и материал (силикон), и жизнеподобность."}, {"marker": "-", "text": "\"As cobots\" (как коботы — специальный термин \"collaborative robots\", роботы, работающие совместно с людьми) переведено обобщённо как \"Будучи роботом\" (Being a robot) — теряется специфический технический термин \"cobot\", заменённый на общее \"робот\". Также теряется, что коботы - описание про всех Хаксов, а не только про А7"}, {"marker": "-", "text": "Руины казались дневними, но оказались более продвинутыми. В переводе Руины были древними и технологии оказались совершеннее известных человечеству."}, {"marker": "-", "text": "\"a perfect amalgamation\" (идеальное слияние/сплав — абстрактное понятие соединения элементов) переведено как \"идеально синтезированную особь\" — добавлено конкретное \"особь\" (individual/creature)"}, {"marker": "-", "text": "\"pointless lives\" (бессмысленные жизни) переведено как \"жалкие жизни\" (pitiful/miserable lives) — близкий, но не точный синоним; \"pointless\" конкретно про отсутствие смысла, \"жалкие\" — про эмоциональную окраску/презрение."}, {"marker": "-", "text": "\"inferior\" (низших/неполноценных) переведено как \"жалких\" (pitiful) — снова та же замена, что и выше, смещение с объективной характеристики \"неполноценности\" на презрительно-эмоциональное \"жалких\"."}, {"marker": "-", "text": "\"dismembering\" (расчленяя — конкретное действие разделения тела на части) переведено как \"выпотрошив\" (disemboweling/gutting) — разные по характеру действия: расчленение подразумевает разделение на части, потрошение — извлечение внутренностей, это не полностью синонимичные действия."}, {"marker": "-", "text": "\"the female science officer\" (конкретная должность — офицер науки/научный сотрудник) переведено обобщённо как \"женщину-исследователя\" — небольшое размытие конкретного звания/должности до более общего описания."}, {"marker": "-", "text": "\"only to be interrupted by\" (только чтобы быть прерванным — Хакса прервали/помешали ему) переведено как \"По дороге ему попалось\" (on the way, he came across) — смена динамики: в оригинале акцент на том, что процесс работы Хакса был прерван кем-то, а в переводе это скорее случайная встреча по пути, без акцента на \"прерывании\" деятельности."}, {"marker": "-", "text": "\"the persona\" (эту личность/персону — слово, подчёркивающее некую системную/техническую характеристику \"личности\" в контексте фантастики про ИИ) переведено просто как \"его\" — небольшая потеря специфического слова \"persona\", хотя итоговый смысл ясен."}, {"marker": "-", "text": "«Definitely» — стопроцентная уверенность Хакса в прогнозе. «С максимальной вероятностью» — это уже вероятностная оценка, а не уверенность. Меняется характер мышления Хакса (расчётливая ИИ-уверенность vs. вероятностная оговорка)."}, {"marker": "-", "text": "\"the medical officer\" (медицинский офицер, конкретная должность) переведено обобщённо как \"врач\" — небольшое упрощение звания."}, {"marker": "-", "text": "\"human insects\" (человеческие насекомые — конкретная метафора, приравнивающая людей к насекомым, важный мотив, который повторяется далее: \"those human insects\", \"the insect pinned\") переведено как \"ничтожных людишек\" — метафора \"насекомых\" потеряна, заменена на оценочное прилагательное \"ничтожных\". Это разрывает последовательную метафору, проходящую через весь текст (люди = насекомые в восприятии Хакса)."}, {"marker": "-", "text": "Опущено little - маленькую, короткую жизнь, мб отсылка на то, что Габрик - клон"}, {"marker": "-", "text": "\"harder\" (твёрже) переведено как \"прочнее\" (stronger/more durable) — близкий, но не идентичный технический термин (hardness ≠ durability/strength в инженерном смысле)."}, {"marker": "-", "text": "\"human insects\" (человеческие насекомые — сохранение метафоры) снова переведено как \"мерзких людей\" — метафора \"насекомых\" опять потеряна (это уже вторая потеря этой ключевой метафоры, хотя чуть раньше в п.72 она была сохранена как \"насекомое\"). Непоследовательность в переводе одного и того же образа."}, {"marker": "-", "text": "\"Confused\" (сбитый с толку/растерянный) переведено как \"Смущенным\" (embarrassed) — это разные эмоциональные состояния: \"confused\" про когнитивную растерянность, \"смущённый\" в русском чаще про неловкость/стеснение. Точнее было бы \"растерянным\" или \"сбитым с толку\"."}, {"marker": "-", "text": "\"melt away\" (плавится/тает) переведено как \"сгорает\" (burns) — разные процессы разрушения материала, хотя оба связаны с повреждением от огня/жара, \"плавление\" и \"горение\" — не тождественные явления."}, {"marker": "-", "text": "«Every last X» — устойчивая идиома «вообще всё, до последнего», то есть подразумевает полное, тотальное уничтожение всех следов. Перевод понял «last» буквально как «последнее (одно)», что сужает тотальность истребления до «одного оставшегося» напоминания (то есть просто Гейба), теряя идиоматический смысл «всё без остатка»."}, {"marker": "-", "text": "\"erased from existence\" (стёрт из существования — универсальное, космическое по масштабу понятие) переведено как \"стереть... с лица планеты\" (erase from the face of the planet) — сужение масштаба с \"существования вообще\" до конкретно \"планеты\""}, {"marker": "-", "text": "Имя Dmitri - Дмитрий перевели как Дима. Разумеется в других упоминаниях этого персонажа его зовут Дмитрий"}, {"marker": "*", "text": "Питательная Смесь: \"Made for the organics\" (сделана для органиков/органических существ) переведено как \"органическая смесь\" (organic mixture) — смысловой сдвиг: в оригинале смесь предназначена ДЛЯ органических существ, а в переводе она сама характеризуется как \"органическая\" по составу — это разные утверждения."}, {"marker": "*", "text": "Интрументы Диагностики: \"the lay of the land\" (идиома — обстановка на местности/расположение объектов, буквально топография) переведено как \"сложившейся ситуации\" (the current situation) — близко по смыслу, но теряется буквальный топографический оттенок идиомы (что более уместно для \"инструмента диагностики строительства\"). \"constructed objects\" (сконструированных/построенных объектов) сокращено до просто \"объектах\" — потеряно уточнение \"constructed\"."}, {"marker": "*", "text": "Рука Андроида: Units (единицы, юниты) != Модули. \"extermination of humans\" (истребление людей — сильное слово) переведено мягче как \"убивать людей\"."}, {"marker": "*", "text": "Foreign Plant Fibers (Волокна Инопланетных Растений) != Волокна Неизвестных Растений"}, {"marker": "*", "text": "Провода под Напряжением: \"a shocking surprise\" (шокирующий сюрприз — игра слов с \"shock\" как удар током и как потрясение) переведено просто как \"ударить током\"."}, {"marker": "*", "text": "Криогель: \"no-friction gel\" (гель, снижающий трение — конкретная физическая характеристика) переведено как \"бесконтактный гель\" (contactless/non-contact gel) — это разные понятия: \"no-friction\" про снижение трения при контакте, \"бесконтактный\" подразумевает отсутствие физического контакта вообще, что физически нелогично для геля, который \"наносят\" (наносить можно только при контакте)."}, {"marker": "*", "text": "Радужный Осколок Кристалла: \"sentience\" (разумность/способность к восприятию и чувствованию — специфический философский/научно-фантастический термин, отличный от простого \"сознания\") переведено как \"сознание\" (consciousness)"}, {"marker": "*", "text": "Ультразвуковой Датчик: грамматическая ошибка: практическИЕ новый орган чувства"}, {"marker": "*", "text": "Гель с Наномашинами: \"have a history of being hacked\" (имеют историю взломов — подразумевает, что это уже случалось не раз) переведено как \"можно взломать\" (can be hacked) — теряется временной/исторический аспект прошлых инцидентов"}, {"marker": "*", "text": "Спрей Гипервнимательности: Опущено слово oversue - злоупотребление, чрезмерное употребление"}, {"marker": "*", "text": "Семейная Фотография Сомы: опущено, что прошлое - вымышленное"}, {"marker": "=", "text": "Вынужденная Нерешительность: Ограничения != Weaknesses - Слабости"}]}, {"title": "ЧУЖОЙ", "items": [{"marker": "-", "text": "Cold (холодный) != Бескрайний"}, {"marker": "*", "text": "Cereal Rations (Злаковые Пайки, Рационы) != Питание Злаками. Описывается процесс вместо предмета"}, {"marker": "*", "text": "Пьющая Птичка: «A bit of whimsy in an otherwise sterile environment» — констатация контраста: кругом холодная чистота, а тут — маленький островок чудаковатости. Никакой прямой оценки «уместно/неуместно» оригинал не даёт."}, {"marker": "*", "text": "Гарнитура Экипажа: В оригинале болтовня позволяет быстрее легче обнаружить экипаж. В переводе же болтовня экипажа позволяет быстрее обнаружить КСЕНОМОРФА))))"}, {"marker": "*", "text": "Внутренности Эша: Beings (Существа) != Устройства"}, {"marker": "*", "text": "Molted Skin (Кожа Линьки, Выползок) != Растекшаяся шкурка"}, {"marker": "*", "text": "Семиотическая Клавиатура: Легендарный перевод. В оригинале к универсальным символам на клавиатуре требуется некоторое время, чтобы при ": "-", "text": "Бунтарская ≠ Combative - задиристая, драчливая. В переводе Дэвид бы стал революционером, ходил бы на парады, протестовал и собирал последователей. В оригинале он просто хотел попиздиться с кем-либо"}, {"marker": "-", "text": "Несносный ≠ Reckless. В оригинале Дэвид был безрассудным, то есть тем человеком, кто сгоряча решает проблемы - кулаками. В переводе он капризный, надоедливый, тяжёлый в общении"}, {"marker": "-", "text": "В одном абзаце опущены: when he lost his temper; and cutting short what most people assumed was going to be a long, successful career"}, {"marker": "-", "text": "Также опущены: of a career, most of his и in a way"}, {"marker": "=", "text": "Новая квота Крепкого Орешка: \"Что-то!\". -"}, {"marker": "=", "text": "Текст уменьшен у новых квотов. Ёбанные бхвр"}]}, {"title": "КВЕНТИН", "items": [{"marker": "-", "text": "Опущена фамилия Квентина - Смит, также опушена фамилия Фредди"}, {"marker": "-", "text": "Ничего не вышло ≠ Success had been short-lived - Успех был кратковременным"}, {"marker": "-", "text": "Чего бы это не стоило ≠ It might take many attempts - Может потребоваться много попыток"}, {"marker": "-", "text": "Опущено somehow he would find a way - каким-то образом он найдёт способ (в птб вместо he - they)"}, {"marker": "-", "text": "Ни читали ≠ He requested were - какие бы книги не запрашивал Квентин"}, {"marker": "-", "text": "Глотая ≠ Steady diet - У Квентина было чёткое и постоянное расписание по принятию таблеток и энергетиков. В переводе он просто глотал"}, {"marker": "-", "text": "Опущено taunting, что Фредди дразнил Квентина"}, {"marker": "-", "text": "Он потихоньку тренировался ≠ He tested this skill carefully. В оригинале Квентин проверял этот навык с осторожностью, а не потихоньку тренировался, поскольку Фредди мог запалить это"}, {"marker": "-", "text": "Опущено: that it would give him some kind of advantage that - что это могло бы дать ему какое-то преимущество"}, {"marker": "-", "text": "Гоняться ≠ Taunting - дразнить, насмехаться"}, {"marker": "-", "text": "Пришить ≠ Gut - выпотрошить"}, {"marker": "-", "text": "В оригинале целый коридор окутало пламя, а не только Фреддоса"}, {"marker": "-", "text": "Опущено, running through the building, heading for the exit that he knew existed - он побежал через всё здание по направлению к выходу, который точно существовал"}, {"marker": "-", "text": "Опущено and his escape route was blocked"}, {"marker": "-", "text": "Опущено проявление Сущности: with roiling tendrils of fog"}, {"marker": "=", "text": "Wake Up! Опущен знак восклицания в переводе, зато во всех квотах он есть"}]}, {"title": "ТЭПП", "items": [{"marker": "-", "text": "Опущено: who would soon be behind bars"}, {"marker": "-", "text": "Столкнулись ≠ Apprehended - задержали, арестовали"}, {"marker": "-", "text": "Лишили звания ≠ Discharged from the force - Уволили со службы"}, {"marker": "-", "text": "Опущено he channeled - он направил"}, {"marker": "-", "text": "Опущено colleague"}, {"marker": "-", "text": "Неправильная последовательность действий: в оригинале и в фильме Тэпп сначала увидел незнакомца в окне, а затем услышал выстрелы. В переводе же всё наоборот + окно заменено на квартиру"}, {"marker": "-", "text": "Опущено and the man fled"}, {"marker": "-", "text": "Оригинал: колючие, ищущие и цепляющие ветви. Перевод: медленно покачивающиеся на ветру верхушки деревьев"}, {"marker": "-", "text": "Обрёл свою былую ≠ A new filled him - обрёл новую"}, {"marker": "-", "text": "Опущено and he always would be a cop"}, {"marker": "=", "text": "Выслеживание Подозреваемого: Я ≠ We're. В Пиле Тэпп обращается к Сингу, так как кукуха совсем поехала, поэтому говорит мы"}, {"marker": "", "text": "КЕЙТ ДЕНСОН* - Лучше рассказать целую историю о ней. Также, как и перки. Это в разделе с музыкой, так как с музыкой ДОХУИЩА ошибок"}, {"marker": "", "text": "АДАМ (одна из худших историй, но они хоть что-то пытались перевести):"}, {"marker": "-", "text": "\"strict\" (строгий) переведено как \"жестким\" (harsh/tough) — небольшое усиление интенсивности характеристики."}, {"marker": "-", "text": "\"His campus... was known for its focus on athletics\" (его кампус был известен упором на спорт — институциональная характеристика заведения) переведено как \"все остальные на кампусе фанатели от спорта\" (everyone else on campus were sports fanatics) — смещение фокуса с характеристики учебного заведения на поведение людей в нём, что меняет структуру утверждения."}, {"marker": "-", "text": "это предложение полностью отсутствует в переводе. \"What he lacked in sports, he made up in grit\" (что ему не хватало в спорте, он компенсировал упорством/стойкостью) — важная характеризующая деталь личности персонажа, отсутствующая в русском тексте."}, {"marker": "-", "text": "\"He learned to defend himself\" (он научился защищать себя — возможно, буквальная физическая защита) переведено как \"научился парировать усмешки\" (learned to parry taunts/jeers) — сужение с общей самозащиты до конкретно словесных насмешек. \"In the thick of it\" (в самой гуще происходящего/в разгар конфликта) заменено на добавленное \"Характер... закалялся\" — это интерпретация, а не прямой перевод."}, {"marker": "-", "text": "\"orbited the music industry\" (вращались вокруг музыкальной индустрии — образная метафора, подразумевающая связь с индустрией, не обязательно прямое занятие музыкой) переведено как \"выбрали музыкальное направление\" (chose the music direction) — конкретизация образной метафоры до прямого выбора карьеры."}, {"marker": "-", "text": "\"granted him admission to higher education\" (дали ему доступ к высшему образованию — конкретное поступление в вуз) переведено как \"позволяли выбирать профессию\" (allowed him to choose a profession) — смена конкретного факта поступления в вуз на более общее \"выбор профессии\"."}, {"marker": "-", "text": "university != колледж"}, {"marker": "-", "text": "\"to afford applying fees overseas\" (чтобы позволить себе оплату взносов за подачу заявления за рубежом) переведено обобщённо как \"чтобы заработать на переезд\" (to save up for moving) — конкретная цель (оплата заявочных взносов) заменена на более общую (переезд)."}, {"marker": "-", "text": "\"long commutes\" (долгие поездки на работу) переведено как \"бесконечных уроков\" (endless lessons) — подмена понятия: \"commutes\" — это именно поездки/дорога, а не сами уроки, что меняет смысл перечисления."}, {"marker": "-", "text": "\"managed to apply for a position\" (смог подать заявку на должность — это подача заявления, ещё не сам переезд) переведено как \"смог себе позволить перебраться\" (could afford to move) — забегание вперёд, подмена этапа процесса (подача заявки ≠ сам переезд)."}, {"marker": "-", "text": "His life... was hectic\" (его жизнь была беспокойной/суматошной — характеристика темпа/интенсивности жизни) переведено как \"Кагосима оказалась не такой гостеприимной, как казалось\" (Kagoshima turned out not as welcoming as it seemed) — это совершенно другое утверждение: вместо \"суматошности\" жизни — \"негостеприимность\" места, что является добавленной интерпретацией, не подтверждённой оригиналом."}, {"marker": "-", "text": "\"little time to do everything he took for granted\" (мало времени на то, что он считал само собой разумеющимся дома — конкретно про нехватку времени) переведено как \"радикально отличалась\" (radically different) — обобщение, теряющее конкретную причину (нехватку времени), заменённое на общее утверждение о различиях."}, {"marker": "-", "text": "\"elementary at best\" (в лучшем случае начальный/элементарный уровень — не полное незнание, а низкий уровень владения) переведено как \"Незнание\" (not knowing/ignorance) — искажение уровня владения языком: элементарные знания ≠ полное отсутствие знаний."}, {"marker": "-", "text": "\"luxurious restaurants\" (роскошные рестораны) переведено как \"хороших ресторанах\" (good restaurants) — ослабление характеристики."}, {"marker": "-", "text": "\"Rails hissed\" (рельсы зашипели — конкр xt": "Тихоокеанском Северо-Западе ≠ Appalachians. Новый перевод"}, {"marker": "-", "text": "В резервацию на краю обширного леса ≠ Georgia. Новый перевод"}, {"marker": "-", "text": "В глухих дебрях ≠ Deep in the woods of Blood Mountain. Новый перевод"}, {"marker": "-", "text": "Старейшина поведал историю ≠ He learned. Новый перевод"}, {"marker": "-", "text": "Вопреки советам старейшины, Шейн отправился в чащу, где со временем вышел на неестественно выглядящую прогалину != Shane left his motorcycle behind. He hiked the mountain trail and ventured into the woods where Jake was last seen. Time seemed to slip away. Shane kept walking, deeper and deeper into the forest, until he came to an unnatural clearing. Новый перевод"}, {"marker": "=", "text": "Полный Газ: зачем-то добавлен восклицательный знак. Лучше бы добавили его к ПРОСНИСЬ!"}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('board-data').textContent);

const MARKER_META = {
  '-': {label:'Общая ошибка / история', cls:'type-dash'},
  '*': {label:'Предмет / деталь',        cls:'type-star'},
  '=': {label:'Перк',                    cls:'type-eq'},
  '%': {label:'Подношение / предмет',    cls:'type-pct'},
  '#': {label:'Подношение / лор',        cls:'type-hash'},
  '^': {label:'Скор-ивент / интеракт',   cls:'type-caret'},
  '':  {label:'Под-раздел',              cls:'subhead'}
};

// ---------- header bits ----------
document.getElementById('timecodePin').textContent = DATA.timecode;

const legendEl = document.getElementById('legend');
let legendHtml = '<div class="lg-title">Типы заметок</div>';
['-','*','=','%','#','^'].forEach(m=>{
  legendHtml += `<span class="chip"><span class="swatch" style="background:var(--c-${symName(m)}-bg)">${m}</span>${MARKER_META[m].label}</span>`;
});
legendEl.innerHTML = legendHtml;

function symName(m){
  return {'-':'dash','*':'star','=':'eq','%':'pct','#':'hash','^':'caret'}[m];
}

// ---------- sidebar ----------
const GENERAL_TITLES = new Set(['ЗАМЕТКИ','БАЗОВЫЕ ПЕРКИ, ПРЕДМЕТЫ И АДДОНЫ ВЫЖИВШИХ, ПОДНОШЕНИЯ И ДРУГИЕ ОШИБКИ']);

const sectionListEl = document.getElementById('sectionList');
document.getElementById('sectionCount').textContent = `Разделов: ${DATA.sections.length} · заметок: ${DATA.sections.reduce((a,s)=>a+s.items.length,0)}`;

function renderSidebar(){
  let html = '';
  let inGeneral = true;
  DATA.sections.forEach((s, idx)=>{
    const isGeneral = GENERAL_TITLES.has(s.title);
    if(isGeneral && inGeneral && idx===0){
      html += `<div class="sec-btn group-label">Общее</div>`;
    }
    if(!isGeneral && inGeneral){
      inGeneral = false;
      html += `<div class="sec-btn group-label">Персонажи</div>`;
    }
    html += `<button class="sec-btn" data-idx="${idx}" title="${escapeHtml(s.title)}"><span>${escapeHtml(s.title)}</span><span class="badge">${s.items.length}</span></button>`;
  });
  sectionListEl.innerHTML = html;
  sectionListEl.querySelectorAll('.sec-btn[data-idx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectSection(parseInt(btn.dataset.idx));
    });
  });
}
renderSidebar();

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- board rendering ----------
const boardGrid = document.getElementById('boardGrid');
const boardTitle = document.getElementById('boardTitle');
const boardCount = document.getElementById('boardCount');

function noteHtml(item, sectionTitle, highlightTerm){
  const meta = MARKER_META[item.marker] ?? MARKER_META['-'];
  let text = escapeHtml(item.text);
  if(highlightTerm){
    const re = new RegExp('(' + highlightTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    text = text.replace(re, '<mark>$1</mark>');
  }
  if(item.marker === ''){
    return `<div class="note subhead">${text}</div>`;
  }
  const sectionTag = sectionTitle ? `<span class="from-sec">${escapeHtml(sectionTitle)}</span>` : '';
  return `<div class="note ${meta.cls}"><span class="mk">${item.marker}</span><p>${text}</p>${sectionTag}</div>`;
}

function selectSection(idx){
  document.getElementById('searchInput').value = '';
  sectionListEl.querySelectorAll('.sec-btn').forEach(b=>b.classList.remove('active'));
  const btn = sectionListEl.querySelector(`.sec-btn[data-idx="${idx}"]`);
  if(btn) btn.classList.add('active');

  const section = DATA.sections[idx];
  boardTitle.textContent = section.title;
  boardCount.textContent = `${section.items.length} заметок`;
  boardGrid.innerHTML = section.items.map(it=>noteHtml(it, null, '')).join('');
}

function runSearch(term){
  term = term.trim();
  sectionListEl.querySelectorAll('.sec-btn').forEach(b=>b.classList.remove('active'));
  if(!term){
    boardTitle.textContent = '—';
    boardCount.textContent = '';
    boardGrid.innerHTML = '<div class="empty-msg">Выберите раздел слева или введите поиск…</div>';
    return;
  }
  const lower = term.toLowerCase();
  let results = [];
  DATA.sections.forEach(s=>{
    s.items.forEach(it=>{
      if(it.text.toLowerCase().includes(lower)){
        results.push({item:it, section:s.title});
      }
    });
  });
  boardTitle.textContent = `Поиск: «${term}»`;
  boardCount.textContent = `${results.length} совпадени${plural(results.length)}`;
  boardGrid.innerHTML = results.length
    ? results.map(r=>noteHtml(r.item, r.section, term)).join('')
    : '<div class="empty-msg">Ничего не найдено 🤷</div>';
}

function plural(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10===1 && mod100!==11) return 'е';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'я';
  return 'й';
}

document.getElementById('searchBtn').addEventListener('click', ()=>runSearch(document.getElementById('searchInput').value));
document.getElementById('searchInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') runSearch(e.target.value);
});
document.getElementById('searchInput').addEventListener('input', e=>{
  if(e.target.value.trim().length >= 3) runSearch(e.target.value);
  if(e.target.value.trim()==='') { boardGrid.innerHTML=''; boardTitle.textContent='—'; boardCount.textContent=''; }
});

// initial view: first section
selectSection(0);
</script>
</body>
</html>
